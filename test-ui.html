<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamCopilot AI Stream Tester</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-color: #0f111a;
            --surface-color: #1a1d2d;
            --border-color: #2a2f4c;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 10;
            box-shadow: 4px 0 24px rgba(0,0,0,0.2);
        }

        .header {
            margin-bottom: 1rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select, textarea {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
            background-color: #4f46e5;
        }

        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .main-content {
            flex: 1;
            padding: 3rem;
            overflow-y: auto;
            position: relative;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent 40%);
        }

        .output-box {
            background: rgba(26, 29, 45, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            min-height: 400px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-wrap;
            position: relative;
            overflow: hidden;
        }

        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            pointer-events: none;
        }

        .placeholder svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .status-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status-badge.active {
            opacity: 1;
        }

        .status-badge.streaming {
            background-color: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .status-badge.done {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Generated MCQ Highlight Styles */
        .token { transition: all 0.1s; }
        .token-new { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
        
        .json-key { color: #818cf8; }
        .json-string { color: #a7f3d0; }
        .json-number { color: #fde047; }
        
        .rendered-mcq {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            font-family: 'Inter', sans-serif;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="header">
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                ExamCopilot
            </h1>
            <p>Live Streaming API Tester</p>
        </div>

        <div class="form-group">
            <label>Exam Type</label>
            <select id="examType">
                <option value="JEE">JEE</option>
                <option value="UPSC">UPSC</option>
                <option value="BOTH">BOTH (Generic)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Topic</label>
            <input type="text" id="topic" value="Thermodynamics" placeholder="e.g., Quantum Physics">
        </div>

        <div class="form-group">
            <label>Number of MCQs</label>
            <input type="number" id="count" value="2" min="1" max="10">
        </div>

        <div class="form-group">
            <label>Context / Notes (Optional)</label>
            <textarea id="content" placeholder="Paste student notes here to test RAG injection..."></textarea>
        </div>

        <div class="form-group">
            <label>Auth Token (JWT)</label>
            <input type="password" id="token" placeholder="Optional for this route if unlocked...">
        </div>

        <button id="generateBtn" onclick="startStream()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Generate Stream
        </button>
    </aside>

    <main class="main-content">
        <div class="output-box" id="outputBox">
            
            <div id="statusBadge" class="status-badge">
                <div class="pulse"></div>
                <span id="statusText">Waiting</span>
            </div>

            <div id="placeholder" class="placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                <h2>Ready to Generate</h2>
                <p>Click the button to stream LangGraph output</p>
            </div>

            <div id="streamContent"></div>
            <div id="renderedQuestions"></div>
        </div>
    </main>

    <script>
        let eventSource = null;
        let streamedText = "";

        // Minimal markdown to HTML if needed (for rendering options)
        const renderMCQs = (questions) => {
            if(!questions || !Array.isArray(questions)) return;
            const container = document.getElementById('renderedQuestions');
            let html = '<h3 style="color:var(--text-main); font-family:Inter; border-bottom:1px solid var(--border-color); padding-bottom:1rem;">Final JSON Reconstructed:</h3>';
            
            questions.forEach((q, i) => {
                html += `
                    <div class="rendered-mcq">
                        <strong style="color:var(--accent-color);">Q${i+1}: ${q.question}</strong>
                        <div style="margin: 1rem 0; padding-left: 1rem; border-left: 2px solid var(--border-color);">
                            <div style="margin-bottom:0.5rem; ${q.correct === 'A' ? 'color: var(--success-color)' : ''}">A) ${q.options.A}</div>
                            <div style="margin-bottom:0.5rem; ${q.correct === 'B' ? 'color: var(--success-color)' : ''}">B) ${q.options.B}</div>
                            <div style="margin-bottom:0.5rem; ${q.correct === 'C' ? 'color: var(--success-color)' : ''}">C) ${q.options.C}</div>
                            <div style="margin-bottom:0.5rem; ${q.correct === 'D' ? 'color: var(--success-color)' : ''}">D) ${q.options.D}</div>
                        </div>
                        <div style="font-size:0.85rem; color:var(--text-muted); background:rgba(0,0,0,0.3); padding:1rem; border-radius:6px;">
                            <strong>Explanation:</strong> ${q.explanation}
                        </div>
                        <div style="margin-top: 1rem; font-size: 0.8rem; display: flex; gap: 1rem;">
                            <span style="background:var(--surface-color); padding:2px 8px; border-radius:4px; border:1px solid var(--border-color)">Diff: ${q.difficulty}</span>
                            <span style="background:var(--surface-color); padding:2px 8px; border-radius:4px; border:1px solid var(--border-color)">Subtopic: ${q.subtopic}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function startStream() {
            const topic = document.getElementById('topic').value;
            const examType = document.getElementById('examType').value;
            const count = document.getElementById('count').value;
            const content = document.getElementById('content').value;
            const token = document.getElementById('token').value;
            
            const btn = document.getElementById('generateBtn');
            const placeholder = document.getElementById('placeholder');
            const streamContainer = document.getElementById('streamContent');
            const renderedContainer = document.getElementById('renderedQuestions');
            const badge = document.getElementById('statusBadge');
            const badgeText = document.getElementById('statusText');

            if(!topic || !examType) return alert('Topic and Exam Type are required!');

            // Setup UI
            btn.disabled = true;
            btn.innerHTML = '<div class="pulse"></div> Connecting...';
            placeholder.style.display = 'none';
            streamContainer.innerHTML = '';
            renderedContainer.innerHTML = '';
            streamedText = '';
            
            badge.className = 'status-badge active streaming';
            badgeText.innerText = 'Generating Stream...';

            if(eventSource) eventSource.close();

            const queryStrings = new URLSearchParams({ topic, examType, count, content });
            
            try {
                // If the user's backend is protected, we need to pass token in url since EventSource doesn't natively support headers
                if (token) queryStrings.append('token', token);

                // Note: assuming server runs on port 3000 locally
                const url = `http://localhost:3000/api/stream/mcqs?${queryStrings.toString()}`;
                
                eventSource = new EventSource(url);

                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.error) {
                        badge.className = 'status-badge active error';
                        badgeText.innerText = 'Error';
                        streamContainer.innerHTML += `<div style="color:var(--error-color)">[ERROR] ${data.error}</div>`;
                        eventSource.close();
                        resetBtn(btn);
                        return;
                    }

                    if (data.token) {
                        // Apply slight glow to new tokens
                        const span = document.createElement('span');
                        span.className = 'token token-new';
                        span.innerText = data.token;
                        streamContainer.appendChild(span);
                        
                        setTimeout(() => span.classList.remove('token-new'), 100);
                        
                        // Auto scroll
                        const outputBox = document.getElementById('outputBox');
                        outputBox.scrollTop = outputBox.scrollHeight;
                    }

                    if (data.done) {
                        badge.className = 'status-badge active done';
                        badgeText.innerText = 'Completed';
                        document.querySelector('.status-badge .pulse').style.display = 'none';
                        eventSource.close();
                        resetBtn(btn);

                        if(data.questions) {
                            streamContainer.style.display = 'none'; // hide raw string
                            renderMCQs(data.questions);
                        }
                    }
                };

                eventSource.onerror = (err) => {
                    badge.className = 'status-badge active error';
                    badgeText.innerText = 'Connection Error / CORS';
                    streamContainer.innerHTML += `<div style="color:var(--error-color); margin-top:1rem;">[SYS] Connection closed or failed. Make sure:
1. Backend is running (npm run dev) on port 3000.
2. CORS is enabled in Express.
3. Auth token is valid if the route is strictly protected.</div>`;
                    eventSource.close();
                    resetBtn(btn);
                };

            } catch (err) {
                console.error(err);
                resetBtn(btn);
            }
        }

        function resetBtn(btn) {
            btn.disabled = false;
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Generate Stream';
        }
    </script>
</body>
</html>
