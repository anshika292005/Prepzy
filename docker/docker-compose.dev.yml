services:
  web:
    build:
      target: dependencies
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PYTHON_API_URL: http://api:8080

  api:
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    env_file:
      - ../.env.local
    volumes:
      - ../backend:/app/backend
      - ../ml_service:/app/ml_service

  worker:
    profiles: ["worker"]

  nginx:
    profiles: ["gateway"]

volumes:
  web_node_modules:
